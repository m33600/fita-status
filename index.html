<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fita de status</title>
<style>
  :root {
    --fundo: #f4f2ee;
    --cartao: #ffffff;
    --texto: #1d1f23;
    --suave: #6b6f76;
    --borda: #dedad2;
    --verde: #1f9d55;
    --amarelo: #f0a500;
    --vermelho: #d7372f;
    --apagada: #3b4048;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #15171a;
      --cartao: #1f2226;
      --texto: #eceae6;
      --suave: #9a9ea5;
      --borda: #30343a;
      --apagada: #555b64;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fundo);
    color: var(--texto);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 40px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--suave); margin: 0 0 20px; font-size: 0.95rem; }

  .painel {
    border-radius: 18px;
    padding: 22px 20px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .lampada {
    width: 64px; height: 64px; flex: none;
    border-radius: 50%;
    background: var(--borda);
    transition: background .25s, box-shadow .25s, opacity .25s;
  }
  .lampada.acesa { box-shadow: 0 0 28px 4px var(--brilho, transparent); }
  .lampada.velha { opacity: .35; }
  .textos { min-width: 0; }
  .rotulo { font-size: 0.85rem; color: var(--suave); }
  .atual { font-size: 1.6rem; font-weight: 650; line-height: 1.2; }
  .detalhe { font-size: .9rem; color: var(--suave); margin-top: 4px; }
  .detalhe.ok { color: var(--verde); }

  .botoes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  button {
    appearance: none;
    border: 0;
    border-radius: 16px;
    min-height: 96px;
    padding: 12px;
    color: #fff;
    font: inherit;
    font-size: 1.2rem;
    font-weight: 650;
    cursor: pointer;
    position: relative;
    transition: transform .08s, filter .15s, outline-color .15s;
    outline: 4px solid transparent;
    outline-offset: 3px;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline-color: var(--texto); }
  button[aria-pressed="true"] { outline-color: var(--texto); }
  button:disabled { cursor: progress; filter: saturate(.6) brightness(.9); }
  button .tecla {
    position: absolute; top: 8px; right: 12px;
    font-size: .75rem; font-weight: 500; opacity: .75;
  }
  .b1 { background: var(--verde); }
  .b2 { background: var(--amarelo); color: #2a1f00; }
  .b3 { background: var(--vermelho); }
  .b0 { background: var(--apagada); }

  .aviso {
    min-height: 1.5em;
    margin: 16px 2px 0;
    font-size: .95rem;
  }
  .aviso.erro { color: var(--vermelho); }
  .aviso.ok { color: var(--verde); }
  .rodape {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--borda);
    color: var(--suave);
    font-size: .85rem;
    display: flex; flex-wrap: wrap; gap: 4px 16px;
  }
  .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--suave); margin-right: 6px; vertical-align: 1px; }
  .ponto.ok { background: var(--verde); }
  .ponto.falha { background: var(--vermelho); }

  .sem-coisa { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; padding: 18px; }
  .sem-coisa input {
    width: 100%; margin: 10px 0; padding: 12px; font: inherit;
    border-radius: 10px; border: 1px solid var(--borda); background: var(--fundo); color: var(--texto);
  }
  .sem-coisa button { min-height: 48px; font-size: 1rem; background: var(--apagada); width: 100%; }

  @media (min-width: 520px) {
    .botoes { grid-template-columns: repeat(4, 1fr); }
    button { min-height: 110px; }
  }
</style>
</head>
<body>
<main>
  <h1>Fita de status</h1>
  <p class="sub">Toque numa cor e a fita da fábrica muda em poucos segundos.</p>

  <section id="app" hidden>
    <div class="painel" aria-live="polite">
      <div class="lampada" id="lampada"></div>
      <div class="textos">
        <div class="rotulo">A fita está</div>
        <div class="atual" id="atual">lendo…</div>
        <div class="detalhe" id="detalhe"></div>
      </div>
    </div>

    <div class="botoes" role="group" aria-label="Cor da fita">
      <button class="b1" data-v="1"><span class="tecla">1</span>Verde</button>
      <button class="b2" data-v="2"><span class="tecla">2</span>Amarelo</button>
      <button class="b3" data-v="3"><span class="tecla">3</span>Vermelho</button>
      <button class="b0" data-v="0"><span class="tecla">0</span>Apagar</button>
    </div>

    <p class="aviso" id="aviso" role="status"></p>

    <div class="rodape">
      <span><span class="ponto" id="ponto-fita"></span><span id="fita-info">fita: aguardando…</span></span>
      <span><span class="ponto" id="ponto"></span><span id="conexao">conectando ao dweet.cc…</span></span>
      <span id="nome"></span>
    </div>
  </section>

  <section id="sem-coisa" class="sem-coisa" hidden>
    <strong>Link incompleto</strong>
    <p class="sub" style="margin:6px 0 0">O link precisa terminar com o nome da fita, depois de um <code>#</code>. Peça o link completo a quem enviou, ou cole o nome aqui:</p>
    <form id="form-coisa">
      <input id="campo-coisa" autocomplete="off" spellcheck="false" placeholder="fita-status-…">
      <button type="submit">Abrir</button>
    </form>
  </section>
</main>

<script>
(() => {
  // ?api= só vale com a página aberta no próprio PC (teste por proxy local).
  // Publicada, ela fala sempre com o dweet.cc — um link malicioso não desvia o nome da fita.
  const LOCAL = ['127.0.0.1', 'localhost'].includes(location.hostname);
  const API = (LOCAL && new URLSearchParams(location.search).get('api')) || 'https://dweet.cc';
  const LEITURA_MS = 3000;
  const FITA_ONLINE_S = 75;         // a fita confirma a cada 30 s
  const SEM_CONFIRMAR_MS = 20000;   // depois disso o pedido é dado como não atendido
  const CORES = {
    0: { nome: 'Apagada',  css: 'var(--apagada)' },
    1: { nome: 'Verde',    css: 'var(--verde)' },
    2: { nome: 'Amarelo',  css: 'var(--amarelo)' },
    3: { nome: 'Vermelho', css: 'var(--vermelho)' },
  };

  const $ = (id) => document.getElementById(id);
  const botoes = [...document.querySelectorAll('.botoes button')];

  // O nome da coisa no dweet.cc vem depois do # e nunca sai do navegador para o
  // GitHub: o fragmento não é enviado ao servidor que hospeda a página.
  const coisaDoLink = () => decodeURIComponent(location.hash.slice(1)).trim();
  const coisaValida = (c) => /^[A-Za-z0-9_.\-]{6,120}$/.test(c);

  const abertaEm = Date.now();
  let coisa = '';
  let timer = null;
  let ultimaLeituraOk = 0;
  let enviando = false;
  let pedido;              // status gravado na coisa (null = sem status, undefined = ainda não leu)
  let fita = null;         // última confirmação da fita: {exibindo, em, up, rssi, versao}
  let fitaVistaLocal = 0;  // quando a página viu o "up" mudar (só usado se a fita estiver sem NTP)
  let clique = null;       // {v, em, confirmado, alertado}

  const inteiro = (x) => { const n = parseInt(x, 10); return Number.isNaN(n) ? null : n; };
  const nomeCor = (s) => (s === null || s === undefined || s < 0) ? 'sem status' : (CORES[s]?.nome ?? `valor ${s}`);
  const ha = (s) => s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`;

  function idadeFita() {
    if (!fita) return Infinity;
    if (fita.em > 0) return Math.max(0, Date.now() / 1000 - fita.em);
    return fitaVistaLocal ? (Date.now() - fitaVistaLocal) / 1000 : Infinity;
  }

  function aviso(texto, tipo = '') {
    $('aviso').textContent = texto;
    $('aviso').className = 'aviso ' + tipo;
  }

  function render() {
    const agora = Date.now();
    const idade = idadeFita();
    const online = idade < FITA_ONLINE_S;
    let mostra, detalhe, velha = false;

    if (fita) {
      mostra = fita.exibindo;
      if (!online) {
        velha = true;
        detalhe = idade === Infinity
          ? 'aguardando sinal da fita…'
          : `fita sem sinal há ${ha(idade)}; esta é a última cor que ela confirmou`;
      } else if (pedido !== null && pedido !== undefined && pedido !== fita.exibindo) {
        const demorou = clique && clique.v === pedido && agora - clique.em > SEM_CONFIRMAR_MS;
        detalhe = demorou
          ? `pedido ${nomeCor(pedido)} ainda não confirmado pela fita`
          : `pedido: ${nomeCor(pedido)}, aguardando a fita…`;
      } else {
        detalhe = `✓ confirmado pela fita há ${ha(idade)}`;
      }
    } else {
      mostra = pedido;
      velha = pedido !== undefined;
      detalhe = pedido === undefined ? '' : 'a fita ainda não confirmou nenhuma cor (desligada, sem internet ou firmware antigo)';
    }

    const info = CORES[mostra];
    const lampada = $('lampada');
    $('atual').textContent = mostra === undefined ? 'lendo…' : nomeCor(mostra);
    lampada.style.background = info ? info.css : '';
    lampada.style.setProperty('--brilho', info && mostra !== 0 ? info.css : 'transparent');
    lampada.classList.toggle('acesa', !!info && mostra !== 0 && !velha);
    lampada.classList.toggle('velha', velha);
    $('detalhe').textContent = detalhe;
    $('detalhe').classList.toggle('ok', detalhe.startsWith('✓'));
    botoes.forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.v) === pedido)));

    // Retorno do último clique
    if (clique && !clique.confirmado && fita && online && fita.exibindo === clique.v &&
        (fita.em === 0 || fita.em * 1000 >= clique.em - 3000)) {
      clique.confirmado = true;
      const s = (agora - clique.em) / 1000;
      aviso(`✓ A fita confirmou ${nomeCor(clique.v)} ${s < 1.5 ? 'na hora' : `em ${Math.round(s)} s`}.`, 'ok');
    } else if (clique && !clique.confirmado && !clique.alertado && agora - clique.em > SEM_CONFIRMAR_MS) {
      clique.alertado = true;
      aviso(`A fita ainda não confirmou ${nomeCor(clique.v)}. Ela pode estar desligada ou sem internet; o pedido fica gravado e ela aplica quando voltar.`, 'erro');
    }

    // Rodapé
    const semLeitura = Math.round((agora - (ultimaLeituraOk || abertaEm)) / 1000);
    if (ultimaLeituraOk || semLeitura >= 10) {
      const ok = ultimaLeituraOk && semLeitura < 15;
      $('ponto').className = 'ponto ' + (ok ? 'ok' : 'falha');
      $('conexao').textContent = ok ? 'dweet.cc conectado' : `sem resposta do dweet.cc há ${semLeitura} s`;
    }
    $('ponto-fita').className = 'ponto ' + (!fita ? '' : online ? 'ok' : 'falha');
    $('fita-info').textContent = !fita ? 'fita: sem notícias'
      : online ? `fita online · sinal ${fita.rssi} dBm · ${fita.versao}`
      : 'fita offline';
  }

  // Sem limite, um fetch pendurado deixaria a página cega sem avisar
  const buscar = (url) => fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(8000) });

  async function lerCoisa(nome) {
    const r = await buscar(`${API}/get/latest/dweet/for/${encodeURIComponent(nome)}`);
    const j = await r.json();
    return j.this === 'succeeded' ? (j.with?.[0]?.content ?? null) : null;
  }

  async function ler() {
    try {
      const [p, f] = await Promise.all([lerCoisa(coisa), lerCoisa(coisa + '-fita')]);
      ultimaLeituraOk = Date.now();
      if (!enviando) pedido = p ? inteiro(p.status) : null;
      if (f) {
        const nova = {
          exibindo: inteiro(f.exibindo), em: inteiro(f.em) || 0,
          up: inteiro(f.up), rssi: inteiro(f.rssi), versao: String(f.versao ?? ''),
        };
        if (fita && nova.up !== fita.up) fitaVistaLocal = Date.now();
        fita = nova;
      } else {
        fita = null;
      }
    } catch {
      // a falha aparece no rodapé pelo tempo sem leitura
    }
    render();
  }

  async function gravar(v) {
    if (enviando) return;
    enviando = true;
    botoes.forEach((b) => (b.disabled = true));
    aviso('Enviando…');
    try {
      const r = await buscar(`${API}/dweet/for/${encodeURIComponent(coisa)}?status=${v}`);
      const j = await r.json();
      if (j.this !== 'succeeded') throw new Error(j.because || 'recusado');
      ultimaLeituraOk = Date.now();
      pedido = v;
      const jaEstava = !!fita && idadeFita() < FITA_ONLINE_S && fita.exibindo === v;
      clique = { v, em: Date.now(), confirmado: jaEstava, alertado: false };
      const hora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      aviso(jaEstava ? `A fita já está ${nomeCor(v)}.` : `${CORES[v].nome} enviado às ${hora}. Aguardando a fita confirmar…`, jaEstava ? 'ok' : '');
    } catch (e) {
      const semContato = e.message === 'Failed to fetch' || e.name === 'TimeoutError';
      aviso(`Não foi: ${semContato ? 'sem contato com o dweet.cc' : e.message}. Tente de novo.`, 'erro');
    } finally {
      enviando = false;
      botoes.forEach((b) => (b.disabled = false));
      render();
    }
  }

  function iniciar() {
    coisa = coisaDoLink();
    clearInterval(timer);
    pedido = undefined;
    fita = null;
    clique = null;
    if (!coisaValida(coisa)) {
      $('app').hidden = true;
      $('sem-coisa').hidden = false;
      return;
    }
    $('sem-coisa').hidden = true;
    $('app').hidden = false;
    $('nome').textContent = `fita …${coisa.slice(-4)}`;
    aviso('');
    ler();
    timer = setInterval(() => { if (!document.hidden) ler(); }, LEITURA_MS);
  }

  botoes.forEach((b) => b.addEventListener('click', () => gravar(Number(b.dataset.v))));
  document.addEventListener('keydown', (e) => {
    if ($('app').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof HTMLInputElement) return;
    if (['0', '1', '2', '3'].includes(e.key)) gravar(Number(e.key));
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && coisa) ler(); });
  $('form-coisa').addEventListener('submit', (e) => {
    e.preventDefault();
    const c = $('campo-coisa').value.trim();
    if (coisaValida(c)) location.hash = c;
  });
  window.addEventListener('hashchange', iniciar);
  setInterval(() => { if (coisa && !$('app').hidden) render(); }, 1000);
  iniciar();
})();
</script>
</body>
</html>
